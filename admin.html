<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rabbaniyoon Academy – Owner</title>
<style>
:root{--bg:#EEF3F6;--surface:#fff;--ink:#14213D;--muted:#5B6678;--line:#CFD8E0;--green:#517561;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1626;--surface:#18223A;--ink:#EEF3F6;--muted:#9AA7BD;--line:#2B3856}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 18px 48px}
h1{font-size:1.6rem;margin:0 0 6px}h2{font-size:1.1rem;margin:26px 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:8px}
button{font:inherit;padding:9px 14px;border-radius:10px;border:1.5px solid var(--ink);background:none;color:var(--ink);cursor:pointer}
button.main{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;width:100%;padding:13px}
.row{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row b,.row span{display:block}.row span{color:var(--muted);font-size:.9rem}
.row a,.row button{display:inline-block;margin:8px 8px 0 0;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-size:.95rem}
.add{display:flex;gap:8px;flex-wrap:wrap}.add input{flex:1 1 130px;width:auto;margin:0}
.err{color:#C0392B;min-height:1.2em}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Rabbaniyoon Academy</h1>
<p class="sub">Owner page</p>
<section id="login">
<input id="em" type="email" placeholder="Email" autocomplete="username">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button class="main" id="in">Sign in</button>
<p class="err" id="lerr"></p>
</section>
<section id="panel" hidden>
<button id="out">Sign out</button>
<h2>Open times</h2>
<p class="sub">Students see these in the calendar. Times use your device time zone.</p>
<div class="add"><input id="od" type="date" aria-label="Date"><input id="ot" type="time" aria-label="Time"><button id="oadd">Add open time</button></div>
<div id="olist"></div>
<h2>Bookings</h2>
<div id="blist"></div>
<p class="err" id="perr"></p>
</section>
</main>
<script src="config.js"></script>
<script>
var C=CONFIG, tok=null, $=function(i){return document.getElementById(i);};
try{tok=sessionStorage.getItem("tok");}catch(e){}
var fmt=new Intl.DateTimeFormat("en",{weekday:"short",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
function api(path,o){
  o=o||{};
  return fetch(C.SUPABASE_URL+"/rest/v1/"+path,{method:o.method||"GET",headers:{apikey:C.SUPABASE_ANON_KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):undefined})
  .then(function(r){
    if(r.status===401){signOut();throw new Error("auth");}
    return r.text().then(function(t){if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;});
  });
}
function show(){$("login").hidden=!!tok;$("panel").hidden=!tok;if(tok)load();}
function signOut(){tok=null;try{sessionStorage.removeItem("tok");}catch(e){}show();}
$("out").onclick=signOut;
$("in").onclick=async function(){
  $("lerr").textContent="";
  try{
    var r=await fetch(C.SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:C.SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});
    var j=await r.json();
    if(!r.ok||!j.access_token)throw new Error("bad");
    tok=j.access_token;try{sessionStorage.setItem("tok",tok);}catch(e){}
    $("pw").value="";show();
  }catch(e){$("lerr").textContent="Wrong email or password.";}
};
function sure(btn,label,fn){
  btn.onclick=async function(){
    if(btn.dataset.s!=="1"){btn.dataset.s="1";btn.textContent="Tap again to confirm";return;}
    btn.disabled=true;
    try{await fn();await load();}catch(e){btn.disabled=false;btn.dataset.s="";btn.textContent="Failed, try again";}
  };
  btn.textContent=label;
}
async function load(){
  $("perr").textContent="";
  try{
    var since=encodeURIComponent(new Date(Date.now()-86400000).toISOString());
    var r=await Promise.all([api("bookings?select=*&starts_at=gte."+since+"&order=starts_at.asc"),api("open_times?select=*&starts_at=gte."+since+"&order=starts_at.asc")]);
    var bl=$("blist");bl.innerHTML="";
    if(!r[0].length)bl.textContent="No bookings yet.";
    r[0].forEach(function(x){
      var el=document.createElement("div");el.className="row";
      var a=document.createElement("b");a.textContent=fmt.format(new Date(x.starts_at));
      var b=document.createElement("span");b.textContent=x.name+" · "+x.email+" · "+x.phone+" · "+x.topic+(x.focus?" ("+x.focus+")":"")+(x.tz?" · student zone: "+x.tz:"");
      el.appendChild(a);el.appendChild(b);
      var d=x.phone.replace(/\D/g,"");
      if(d.length>=7){var w=document.createElement("a");w.href="https://wa.me/"+d;w.target="_blank";w.rel="noopener";w.textContent="WhatsApp";el.appendChild(w);}
      var c=document.createElement("button");sure(c,"Cancel class",function(){return api("bookings?id=eq."+x.id,{method:"DELETE"});});
      el.appendChild(c);bl.appendChild(el);
    });
    var ol=$("olist");ol.innerHTML="";
    if(!r[1].length)ol.textContent="No open times yet.";
    r[1].forEach(function(x){
      var el=document.createElement("div");el.className="row";
      var a=document.createElement("b");a.textContent=fmt.format(new Date(x.starts_at));
      var c=document.createElement("button");sure(c,"Remove",function(){return api("open_times?id=eq."+x.id,{method:"DELETE"});});
      el.appendChild(a);el.appendChild(c);ol.appendChild(el);
    });
  }catch(e){if(e.message!=="auth")$("perr").textContent="Could not load. Check your connection.";}
}
$("oadd").onclick=async function(){
  var d=$("od").value,t=$("ot").value;if(!d||!t)return;
  var when=new Date(d+"T"+t);if(when<=new Date())return;
  try{await api("open_times",{method:"POST",body:{starts_at:when.toISOString()}});$("ot").value="";await load();}
  catch(e){$("perr").textContent="Could not add (maybe it already exists).";}
};
show();
</script>
</body>
</html>
